name: CI

on:
  push:
    branches: [main]
  pull_request:

# On main, every push keeps its own run (E40): "Deploy jobs" follows each green run of main, so a
# cancelled run would skip a deploy. Pull requests still cancel their older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      # Every migration on a throwaway Postgres, then the RLS checks in supabase/tests
      # (the runner image ships PostgreSQL 16).
      - name: Database migrations and RLS checks
        run: bash supabase/tests/local/run.sh

      # With its system packages; if the Ubuntu mirror is unreachable (it was, on 2026-11-11),
      # give up on them after 3 minutes and install the browser alone: the runner image already
      # has what Chromium needs to run.
      - name: Install Playwright browser
        run: |
          timeout 180 pnpm --filter @brotasites/templates exec playwright install --with-deps chromium \
            || pnpm --filter @brotasites/templates exec playwright install chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/templates/playwright-report
          retention-days: 7

      - name: Upload the platform's e2e results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-e2e-results
          path: apps/platform/test-results
          retention-days: 7

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a secret committed and later deleted is still found.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      # Fails on high and critical advisories; low and moderate ones are listed in the log.
      - name: Dependency audit
        run: pnpm audit --audit-level high

      # Gitleaks (MIT), a pinned release checked against its published checksum.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks git . --no-banner --redact --verbose

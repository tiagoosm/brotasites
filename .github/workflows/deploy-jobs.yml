# Publishes the generation jobs (apps/jobs) to Trigger.dev's production environment (E35, E40).
# Two ways in:
#   - Automatic (owner's decision of 2026-11-13): after the CI of a push to main ends green, when
#     that push changed what the jobs run (apps/jobs, packages/*, the lockfile, the Node version or
#     this file). Docs-only or platform-only merges deploy nothing.
#   - Manual: "Run workflow" on main, typing "publicar" (to redeploy, or after a failed run).
# TRIGGER_ACCESS_TOKEN (a Production "Deploy only" API key) is a secret of the repository's
# "production" environment; the project ref is an environment variable (vars.TRIGGER_PROJECT_REF),
# never written in the code. With "Required reviewers" on that environment, each deploy waits for
# the owner's approval. The Playwright browser the jobs need is installed by Trigger.dev's own
# build (trigger.config.ts), not on this runner.
# See docs/owner-steps.md, "Publishing from GitHub", and "How to revert".
name: Deploy jobs

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite "publicar" para publicar as tarefas no Trigger.dev'
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-jobs
  cancel-in-progress: false

jobs:
  guard:
    name: Check the request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.manual.outputs.deploy || steps.auto.outputs.deploy }}
      sha: ${{ steps.manual.outputs.sha || steps.auto.outputs.sha }}
    steps:
      # The typed value goes through env, never into the script's text.
      - name: Manual run, only main, only with the confirmation
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirmacao }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Publique só a partir da main (pedido em $REF)."
            exit 1
          fi
          if [ "$CONFIRMATION" != "publicar" ]; then
            echo "::error::Confirmação ausente: digite publicar."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Automatic: only a green CI of a push to main in this repository (never a pull request,
      # never a fork), and only when the push changed what the jobs run.
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Automatic run after CI on main
        id: auto
        if: github.event_name == 'workflow_run'
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          FROM_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$CONCLUSION" != "success" ] || [ "$EVENT" != "push" ] || [ "$BRANCH" != "main" ] || [ "$FROM_REPO" != "$THIS_REPO" ]; then
            echo "CI de $EVENT em $BRANCH terminou como $CONCLUSION: nada a publicar."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A squash merge is one commit; a merge commit is compared with its first parent.
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "Arquivos mudados:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -Eq '^(apps/jobs/|packages/|pnpm-lock\.yaml$|package\.json$|pnpm-workspace\.yaml$|\.nvmrc$|\.github/workflows/deploy-jobs\.yml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nada que as tarefas usam mudou: nada a publicar."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy the jobs
    needs: guard
    if: needs.guard.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: The project ref is set
        env:
          TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
        run: |
          if [ -z "$TRIGGER_PROJECT_REF" ]; then
            echo "::error::Falta a variável TRIGGER_PROJECT_REF no ambiente production do GitHub."
            exit 1
          fi

      # Exactly the commit CI checked (or, by hand, the head of main).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The jobs import the workspace packages from their dist/ folders.
      - name: Build the packages the jobs use
        run: pnpm exec turbo run build --filter=@brotasites/jobs^...

      # E36: what the deploy will use, to compare with the Trigger.dev dashboard. Prints no secret
      # and no email: the token only as its prefix kind, the whoami output without lines that
      # contain "@", and from the project lookup only its name and id (never its apiKey). No
      # `set -x`. A failure here never stops the deploy, so its own error still shows below.
      - name: Diagnóstico (sem segredos)
        continue-on-error: true
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
        run: |
          echo "CLI do Trigger.dev: $(pnpm --silent --filter @brotasites/jobs exec trigger --version 2>&1 | tail -n 1)"
          echo "TRIGGER_PROJECT_REF: $TRIGGER_PROJECT_REF"
          case "$TRIGGER_ACCESS_TOKEN" in
            "") kind="vazio" ;;
            tr_prod_*) kind="chave de API do ambiente Production (tr_prod_)" ;;
            tr_pat_*) kind="token pessoal (tr_pat_)" ;;
            tr_*) kind="outra chave do Trigger.dev (tr_)" ;;
            *) kind="formato desconhecido" ;;
          esac
          echo "TRIGGER_ACCESS_TOKEN: $kind"

          # whoami reads only the login saved by `trigger login` (a personal token), not
          # TRIGGER_ACCESS_TOKEN: with an environment API key it is expected to fail here.
          # It exits 0 even when it fails, so the outcome is read from its text.
          out="$(mktemp)"
          (cd apps/jobs && pnpm --silent exec trigger whoami --project-ref "$TRIGGER_PROJECT_REF") >"$out" 2>&1 || true
          if grep -q "Account details" "$out" && ! grep -q "Whoami failed" "$out"; then
            echo "whoami: ok"
          else
            echo "whoami falhou (esperado com chave de ambiente: o whoami só usa o login pessoal)"
          fi
          sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$out" | grep -v '@' | grep '[[:alnum:]]' | sed 's/^/  /' || true
          rm -f "$out"

          # The same lookup the deploy makes before it starts: does this key open this project?
          # shellcheck disable=SC2016 # the ${...} below are JavaScript, not shell
          node --input-type=module -e '
            const ref = process.env.TRIGGER_PROJECT_REF;
            const response = await fetch(`https://api.trigger.dev/api/v1/projects/${ref}/prod`, {
              headers: { Authorization: `Bearer ${process.env.TRIGGER_ACCESS_TOKEN}` },
              signal: AbortSignal.timeout(15000),
            }).catch((error) => ({ ok: false, status: "sem resposta", error }));
            if (!response.ok) {
              let detail = "";
              try { detail = (await response.json()).error ?? ""; } catch {}
              console.log(`Projeto com esta chave: falhou (${response.status}) ${String(detail).replace(/\S+@\S+/g, "[e-mail]")}`);
            } else {
              const body = await response.json();
              console.log(`Projeto com esta chave: ok, nome "${body.name}", id ${body.projectId}`);
            }
          ' || echo "Projeto com esta chave: não foi possível consultar"

      # --env prod must match the API key's environment; --external-id makes a second run on the
      # same commit return the existing version instead of building it again.
      - name: Deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
          COMMIT: ${{ needs.guard.outputs.sha }}
        run: pnpm --filter @brotasites/jobs exec trigger deploy --env prod --skip-update-check --external-id "$COMMIT"

# Publishes the generation jobs (apps/jobs) to Trigger.dev's production environment (E35).
# Manual only: the owner clicks "Run workflow" on main and types "publicar". Nothing here runs on
# push or pull request. TRIGGER_ACCESS_TOKEN (a Production "Deploy only" API key) is a secret of
# the repository's "production" environment; the project ref is an environment variable
# (vars.TRIGGER_PROJECT_REF), never written in the code. The Playwright browser the jobs need is
# installed by Trigger.dev's own build (trigger.config.ts), not on this runner.
# See docs/owner-steps.md, "Publishing from GitHub", and "How to revert".
name: Deploy jobs

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite "publicar" para publicar as tarefas no Trigger.dev'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-jobs
  cancel-in-progress: false

jobs:
  guard:
    name: Check the request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The typed value goes through env, never into the script's text.
      - name: Only main, only with the confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmacao }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Publique só a partir da main (pedido em $REF)."
            exit 1
          fi
          if [ "$CONFIRMATION" != "publicar" ]; then
            echo "::error::Confirmação ausente: digite publicar."
            exit 1
          fi

  deploy:
    name: Deploy the jobs
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: The project ref is set
        env:
          TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
        run: |
          if [ -z "$TRIGGER_PROJECT_REF" ]; then
            echo "::error::Falta a variável TRIGGER_PROJECT_REF no ambiente production do GitHub."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The jobs import the workspace packages from their dist/ folders.
      - name: Build the packages the jobs use
        run: pnpm exec turbo run build --filter=@brotasites/jobs^...

      # --env prod must match the API key's environment; --external-id makes a second run on the
      # same commit return the existing version instead of building it again.
      - name: Deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
          COMMIT: ${{ github.sha }}
        run: pnpm --filter @brotasites/jobs exec trigger deploy --env prod --skip-update-check --external-id "$COMMIT"

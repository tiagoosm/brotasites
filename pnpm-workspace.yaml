packages:
  - "apps/*"
  - "packages/*"

# Pin exact versions when adding dependencies (no ^ or ~).
saveExact: true

# Install scripts allowed to run: Wrangler's bundler and Workers runtime binaries.
allowBuilds:
  esbuild: true
  workerd: true
  # trigger.dev CLI: downloads a remote-build helper we do not use (deploys build on Trigger.dev).
  "@depot/cli": false

# Security fixes for transitive dependencies, until their parents ship them.
overrides:
  # GHSA-xjj6-f33q-929c (high): wrangler 4.151 pulls miniflare with undici 7.29.
  "miniflare>undici": "7.30.1"
  # ws memory-exhaustion DoS (high, fixed in 8.21.0): @trigger.dev/sdk > socket.io-client.
  "engine.io-client>ws": "8.21.3"
  # trigger.dev CLI and @trigger.dev/build (apps/jobs dev tools), until they ship the fixes:
  # zod memory exhaustion (GHSA-mrhx-c7xc-m3w5, fixed in 4.6.6);
  "zod@<4.6.6": "4.6.7"
  # node-tar advisories up to GHSA-r292-9mhp-454m (fixed in 7.5.21), via c12 > giget;
  "giget>tar": "7.5.22"
  # DeepmergeTS stack exhaustion (GHSA-ggr8-5vv4-36mx, fixed in 8.0.0), via @prisma/config.
  "@prisma/config>deepmerge-ts": "8.0.2"

minimumReleaseAgeExclude:
  - "@trigger.dev/build@4.8.5"
  - "@trigger.dev/core@4.8.5"
  - "@trigger.dev/schema-to-json@4.8.5"
  - "@trigger.dev/sdk@4.8.5"
  - trigger.dev@4.8.5

patchedDependencies:
  picomatch@2.3.2: patches/picomatch@2.3.2.patch
  picomatch@4.0.7: patches/picomatch@4.0.7.patch

# picomatch ReDoS (GHSA-fc5q-39xc-vjpf, CVE-2026-112366): no fixed version exists yet, so the
# fix is the local patch above (patches/picomatch@*.patch). `pnpm audit` only sees version
# numbers, not patches, so this advisory is accepted here ONLY while the patch is applied:
# scripts/security/picomatch-patch.test.mjs fails if any picomatch in the lockfile is
# unpatched or the attack pattern still hangs. When picomatch publishes a fix, update it,
# drop the patch and this entry (docs/security.md).
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
